server:
  port: ${PORT:8000}

spring:
  application:
    name: bidmart-gateway
  cloud:
    gateway:
      # Centralized CORS Configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Set-Cookie
              
      routes:
        # WebSocket Route
        - id: notification-service-ws
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/ws/notifications/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: auth-service-ws
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/ws/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            
        # Standard HTTP Routes
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**
            
        - id: catalogue-service
          uri: ${CATALOGUE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/catalogue/**
            
        - id: auction-service
          uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auctions/**
            
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/wallet/**
            
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**

        - id: notification-service-api
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**

app:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:bidmart-auth-secret-key-bidmart-auth-secret-key}
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN:bidmart-local-internal-token}
    rate-limit:
      max-attempts: ${GATEWAY_RATE_LIMIT_MAX_ATTEMPTS:20}
      window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
