server:
  port: ${PORT:8000}

spring:
  application:
    name: bidmart-gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_INSTANCE_0:http://auth-service:8080}
            catalogue-service:
              - uri: ${CATALOGUE_SERVICE_INSTANCE_0:http://catalogue-service:8081}
            auction-service:
              - uri: ${AUCTION_SERVICE_INSTANCE_0:http://auction-service:8082}
            wallet-service:
              - uri: ${WALLET_SERVICE_INSTANCE_0:http://wallet-service:8083}
            order-notification-service:
              - uri: ${ORDER_SERVICE_INSTANCE_0:http://order-notification-service:8084}
    loadbalancer:
      retry:
        enabled: true
      # Use Consistent Hash (Sticky Sessions) for WebSockets/SockJS
      # This ensures fallbacks like Long Polling stay on the same instance.
      clients:
        order-notification-service:
          load-balancer:
            type: weighted
        auth-service:
          load-balancer:
            type: weighted

    gateway:
      # WebSocket Timeouts
      # Prevents idle connections from hanging indefinitely and consuming resources.
      httpclient:
        websocket:
          max-frame-payload-length: 65536
          proxy-ping-interval: 30s
        connect-timeout: 5000
        response-timeout: 300s # Maximum duration for a single request/websocket stream
      # Centralized CORS Configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Set-Cookie
              
      routes:
        # WebSocket Route
        - id: notification-service-ws
          uri: ${GATEWAY_ORDER_WS_SERVICE_URL:lb://order-notification-service}
          predicates:
            - Path=/ws/notifications/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: auth-service-ws
          uri: ${GATEWAY_AUTH_WS_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/ws/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            
        # Standard HTTP Routes
        - id: auth-service
          uri: ${GATEWAY_AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/api/v1/auth/**
            
        - id: catalogue-service
          uri: ${GATEWAY_CATALOGUE_SERVICE_URL:lb://catalogue-service}
          predicates:
            - Path=/api/v1/catalogue/**
            
        - id: bidding-service
          uri: ${GATEWAY_AUCTION_SERVICE_URL:lb://auction-service}
          predicates:
            - Path=/api/v1/listings,/api/v1/listings/**

        - id: wallet-service
          uri: ${GATEWAY_WALLET_SERVICE_URL:lb://wallet-service}
          predicates:
            - Path=/api/v1/wallet/**
            
        - id: order-service
          uri: ${GATEWAY_ORDER_SERVICE_URL:lb://order-notification-service}
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**

        - id: notification-service-api
          uri: ${GATEWAY_ORDER_SERVICE_URL:lb://order-notification-service}
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**

app:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:bidmart-auth-secret-key-bidmart-auth-secret-key}
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN:bidmart-local-internal-token}
    rate-limit:
      max-attempts: ${GATEWAY_RATE_LIMIT_MAX_ATTEMPTS:20}
      window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}

bidmart:
  metrics:
    basic-user: ${METRICS_BASIC_USER:}
    basic-password: ${METRICS_BASIC_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
