name: ${COMPOSE_PROJECT_NAME:-bidmart}

# Compose applies later env_file entries last. Each optional repo-specific .env
# is a fallback, and the infrastructure .env is loaded last as the stack source
# of truth.
x-env-files:
  gateway: &gateway-env-files
    - path: .env
      required: false
  auth: &auth-env-files
    - path: ../bidmart-auth-service/.env
      required: false
    - path: .env
      required: false
  catalogue: &catalogue-env-files
    - path: ../bidmart-catalogue-service/.env
      required: false
    - path: .env
      required: false
  auction: &auction-env-files
    - path: ../bidmart-auction-service-rust/.env
      required: false
    - path: .env
      required: false
  wallet: &wallet-env-files
    - path: ../bidmart-wallet-service-rust/.env
      required: false
    - path: .env
      required: false
  order: &order-env-files
    - path: ../bidmart-order-and-notification-service/.env
      required: false
    - path: .env
      required: false
  frontend: &frontend-env-files
    - path: ../bidmart-frontend/.env
      required: false
    - path: .env
      required: false

services:
  gateway:
    image: ${GATEWAY_IMAGE:-bidmart-gateway:local}
    build:
      context: .
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    env_file: *gateway-env-files
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8080}
      CATALOGUE_SERVICE_URL: ${CATALOGUE_SERVICE_URL:-http://catalogue-service:8081}
      AUCTION_SERVICE_URL: ${AUCTION_SERVICE_URL:-http://auction-service:8082}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-http://wallet-service:8083}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-notification-service:8084}
    depends_on:
      - auth-service
      - catalogue-service
      - auction-service
      - wallet-service
      - order-notification-service
    restart: ${RESTART_POLICY:-unless-stopped}

  auth-service:
    image: ${AUTH_IMAGE:-bidmart-auth-service:local}
    build:
      context: ../bidmart-auth-service
    ports:
      - "${AUTH_PORT:-8080}:8080"
    env_file: *auth-env-files
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL:-jdbc:postgresql://auth-db:5432/bidmart_auth}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${AUTH_DDL_AUTO:-update}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-bidmart-auth-secret-key-bidmart-auth-secret-key}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2000}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AUTH_WALLET_PROVISIONING_EXCHANGE: ${BIDMART_EVENTS_EXCHANGE:-bidmart.events}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}

  catalogue-service:
    image: ${CATALOGUE_IMAGE:-bidmart-catalogue-service:local}
    build:
      context: ../bidmart-catalogue-service
    ports:
      - "${CATALOGUE_PORT:-8081}:8081"
    env_file: *catalogue-env-files
    environment:
      SPRING_DATASOURCE_URL: ${CATALOGUE_DATABASE_URL:-jdbc:postgresql://catalogue-db:5432/bidmart_catalogue}
      SPRING_DATASOURCE_USERNAME: ${CATALOGUE_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CATALOGUE_DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${CATALOGUE_DDL_AUTO:-update}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      BIDMART_EVENTS_EXCHANGE: ${BIDMART_EVENTS_EXCHANGE:-bidmart.events}
    depends_on:
      catalogue-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}

  auction-service:
    image: ${AUCTION_IMAGE:-bidmart-auction-service-rust:local}
    build:
      context: ../bidmart-auction-service-rust
    ports:
      - "${AUCTION_PORT:-8082}:8082"
    env_file: *auction-env-files
    environment:
      BIND_ADDRESS: 0.0.0.0:8082
      DATABASE_URL: ${AUCTION_DATABASE_URL:-postgresql://postgres:postgres@auction-db:5432/bidmart_auction}
      CATALOGUE_SERVICE_URL: ${CATALOGUE_SERVICE_URL:-http://catalogue-service:8081}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-http://wallet-service:8083}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2f}
      BIDMART_EVENTS_EXCHANGE: ${BIDMART_EVENTS_EXCHANGE:-bidmart.events}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-bidmart-local-internal-token}
    volumes:
      - auction-rust-data:/data
    depends_on:
      catalogue-service:
        condition: service_started
      wallet-service:
        condition: service_started
      auction-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}

  wallet-service:
    image: ${WALLET_IMAGE:-bidmart-wallet-service-rust:local}
    build:
      context: ../bidmart-wallet-service-rust
    ports:
      - "${WALLET_PORT:-8083}:8083"
    env_file: *wallet-env-files
    environment:
      DATABASE_URL: ${WALLET_DATABASE_URL:-postgresql://postgres:postgres@wallet-db:5432/bidmart_wallet_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2f}
      BIDMART_EVENTS_EXCHANGE: ${BIDMART_EVENTS_EXCHANGE:-bidmart.events}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-bidmart-local-internal-token}
      MIDTRANS_SANDBOX_BASE_URL: ${MIDTRANS_SANDBOX_BASE_URL:-https://api.sandbox.midtrans.com}
      MIDTRANS_CHARGE_URL: ${MIDTRANS_CHARGE_URL:-https://api.sandbox.midtrans.com/v2/charge}
      MIDTRANS_STATUS_BASE_URL: ${MIDTRANS_STATUS_BASE_URL:-https://api.sandbox.midtrans.com/v2}
      MIDTRANS_BCA_VA_SIMULATOR_URL: ${MIDTRANS_BCA_VA_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/bca/va/index}
      MIDTRANS_BNI_VA_SIMULATOR_URL: ${MIDTRANS_BNI_VA_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/bni/va/index}
      MIDTRANS_BRI_VA_SIMULATOR_URL: ${MIDTRANS_BRI_VA_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/bri/va/index}
      MIDTRANS_PERMATA_VA_SIMULATOR_URL: ${MIDTRANS_PERMATA_VA_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/openapi/va/index}
      MIDTRANS_MANDIRI_BILL_SIMULATOR_URL: ${MIDTRANS_MANDIRI_BILL_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/openapi/mandiri/index}
      MIDTRANS_QRIS_SIMULATOR_URL: ${MIDTRANS_QRIS_SIMULATOR_URL:-https://simulator.sandbox.midtrans.com/qris/index}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-local}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-local}
      MIDTRANS_IRIS_BASE_URL: ${MIDTRANS_IRIS_BASE_URL:-https://app.sandbox.midtrans.com/iris/api/v1}
      MIDTRANS_IRIS_API_KEY: ${MIDTRANS_IRIS_API_KEY:-IRIS-api-key-local}
      MIDTRANS_IRIS_MERCHANT_KEY: ${MIDTRANS_IRIS_MERCHANT_KEY:-IRIS-merchant-key-local}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      PORT: 8083
      AUCTION_SERVICE_BASE_URL: ${WALLET_AUCTION_SERVICE_BASE_URL:-http://auction-service:8082/api/v1/auctions}
    volumes:
      - wallet-rust-data:/data
    depends_on:
      wallet-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}

  order-notification-service:
    image: ${ORDER_IMAGE:-bidmart-order-and-notification-service:local}
    build:
      context: ../bidmart-order-and-notification-service
    ports:
      - "${ORDER_PORT:-8084}:8084"
    env_file: *order-env-files
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: ${ORDER_DATABASE_URL:-jdbc:postgresql://order-db:5432/bidmart_order}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${ORDER_DDL_AUTO:-update}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      BIDMART_EVENTS_EXCHANGE: ${BIDMART_EVENTS_EXCHANGE:-bidmart.events}
      APP_INTERNAL_SERVICE_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-bidmart-local-internal-token}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file: *frontend-env-files
    environment:
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
      VITE_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: ${FRONTEND_CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${FRONTEND_WATCHPACK_POLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../bidmart-frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - gateway
    restart: ${RESTART_POLICY:-unless-stopped}

  auth-db:
    image: postgres:16-alpine
    ports:
      - "${AUTH_DB_PORT:-5434}:5432"
    env_file: *auth-env-files
    environment:
      POSTGRES_DB: bidmart_auth
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME:-postgres} -d bidmart_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  catalogue-db:
    image: postgres:16-alpine
    ports:
      - "${CATALOGUE_DB_PORT:-5435}:5432"
    env_file: *catalogue-env-files
    environment:
      POSTGRES_DB: bidmart_catalogue
      POSTGRES_USER: ${CATALOGUE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CATALOGUE_DB_PASSWORD:-postgres}
    volumes:
      - catalogue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGUE_DB_USERNAME:-postgres} -d bidmart_catalogue"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  auction-db:
    image: postgres:16-alpine
    ports:
      - "${AUCTION_DB_PORT:-5436}:5432"
    env_file: *auction-env-files
    environment:
      POSTGRES_DB: bidmart_auction
      POSTGRES_USER: ${AUCTION_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUCTION_DB_PASSWORD:-postgres}
    volumes:
      - auction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUCTION_DB_USERNAME:-postgres} -d bidmart_auction"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  wallet-db:
    image: postgres:16-alpine
    ports:
      - "${WALLET_DB_PORT:-5433}:5432"
    env_file: *wallet-env-files
    environment:
      POSTGRES_DB: bidmart_wallet_db
      POSTGRES_USER: ${WALLET_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:-postgres}
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WALLET_DB_USERNAME:-postgres} -d bidmart_wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  order-db:
    image: postgres:16-alpine
    ports:
      - "${ORDER_DB_PORT:-5437}:5432"
    env_file: *order-env-files
    environment:
      POSTGRES_DB: bidmart_order
      POSTGRES_USER: ${ORDER_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-postgres}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME:-postgres} -d bidmart_order"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: ${RESTART_POLICY:-unless-stopped}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}


volumes:
  auth-db-data:
  auction-db-data:
  auction-rust-data:
  catalogue-db-data:
  order-db-data:
  wallet-db-data:
  wallet-rust-data:
  redis-data:
  rabbitmq-data:
  frontend-node-modules:
