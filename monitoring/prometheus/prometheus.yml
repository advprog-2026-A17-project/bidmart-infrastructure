global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: bidmart-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8000

  - job_name: bidmart-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8080

  - job_name: bidmart-catalogue-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - catalogue-service:8081

  - job_name: bidmart-auction-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auction-service:8082

  - job_name: bidmart-wallet-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - wallet-service:8083

  - job_name: bidmart-order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-notification-service:8084
