# Production metrics scrape targets (Grafana Cloud Hosted Collector).
# Auth + order on Heroku; catalogue/auction/wallet/gateway on VPS public hostnames.
# Basic auth: METRICS_BASIC_USER / METRICS_BASIC_PASSWORD (same on Heroku + VPS gateway).

scrape_configs:
  - job_name: bidmart-gateway-staging
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-staging.43.157.208.68.sslip.io:443

  - job_name: bidmart-gateway-prod
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-prod.43.157.208.68.sslip.io:443

  - job_name: bidmart-auth-staging
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-auth-staging-392ed0eda7b8.herokuapp.com:443

  - job_name: bidmart-auth
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-auth-876b62d83c69.herokuapp.com:443

  - job_name: bidmart-order-staging
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-order-staging-a5fd01b90144.herokuapp.com:443

  - job_name: bidmart-order
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bidmart-order-ced842eeb858.herokuapp.com:443
