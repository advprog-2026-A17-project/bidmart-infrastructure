name: Continuous Integration

on:
  pull_request:
    branches: ["staging", "main"]
  push:
    branches: ["staging", "main"]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run unit tests and coverage gate
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-test-coverage
          path: |
            build/reports/tests/test/**
            build/reports/jacoco/test/**

  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning::SONAR_TOKEN is not configured in repository secrets."
            echo "Add SONAR_TOKEN from https://sonarcloud.io/account/security (org: advprog-2026-a17-project)."
            exit 0
          fi
          chmod +x gradlew
          set +e
          ./gradlew test jacocoTestReport sonar 2>&1 | tee sonar.log
          sonar_status=${PIPESTATUS[0]}
          set -e
          if [ "${sonar_status}" -ne 0 ]; then
            if grep -qi "Automatic Analysis is enabled" sonar.log; then
              echo "::warning::SonarCloud Automatic Analysis is enabled in the UI; disable it so CI analysis can run."
              exit 0
            fi
            echo "::error::SonarCloud scan failed (exit ${sonar_status})."
            exit "${sonar_status}"
          fi
          echo "SonarCloud analysis uploaded: https://sonarcloud.io/project/overview?id=advprog-2026-A17-project_bidmart-infrastructure"
