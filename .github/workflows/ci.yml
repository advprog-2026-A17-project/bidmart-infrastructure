name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport

      - name: Upload Test And Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-test-coverage
          path: |
            build/reports/tests/test/**
            build/reports/jacoco/test/**

  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is not configured; skipping SonarCloud analysis."
            exit 0
          fi
          chmod +x gradlew
          set +e
          ./gradlew test jacocoTestReport sonar 2>&1 | tee sonar.log
          sonar_status=${PIPESTATUS[0]}
          set -e
          if [ "${sonar_status}" -ne 0 ]; then
            if grep -qi "Automatic Analysis is enabled" sonar.log; then
              echo "SonarCloud Automatic Analysis is enabled; skipping CI sonar scan."
              exit 0
            fi
            exit "${sonar_status}"
          fi
