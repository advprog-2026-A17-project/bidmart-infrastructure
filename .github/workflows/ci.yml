name: Continuous Integration

on:
  pull_request:
    branches: ["staging", "main"]
  push:
    branches: ["staging", "main"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test
